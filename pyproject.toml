# The PyPI package `dawnfix`: dawnfix-core and every Python tool in one distribution, built
# from this repo's root (`python -m build`). Each tool keeps its own pyproject.toml for
# development (`cd <tool> && make install test`); this file only gathers their sources.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dawnfix"
version = "0.4.0"
description = "Dawnfix, the AI SRE that runs in your own GitHub Actions: the read-only production log check (dawnfix) and the free tools logbill, parity, sweeper, leastpriv, receipt and fleet. Your logs stay in your accounts."
readme = "README.md"
requires-python = ">=3.11"
license = "FSL-1.1-ALv2"
authors = [{ name = "Dawnfix" }]
keywords = ["ai-sre", "sre", "aws", "gcp", "cloudwatch", "github-actions", "finops", "iam"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PyYAML>=6.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
gcp = ["google-cloud-logging>=3.5"]

[project.urls]
Homepage = "https://dawnfix.dev"
Source = "https://github.com/dawnfix/dawnfix"
Documentation = "https://dawnfix.dev/docs/setup"
Issues = "https://github.com/dawnfix/dawnfix/issues"

# The same names as each tool's own pyproject.toml.
[project.scripts]
dawnfix = "dawnfix_core.cli:main"
logbill = "logbill.cli:main"
parity = "dawnfix_parity.cli:main"
sweeper = "dawnfix_sweeper.cli:main"
leastpriv = "dawnfix_leastpriv.cli:main"
receipt = "dawnfix_receipt.cli:main"
fleet = "dawnfix_fleet.cli:main"

[tool.setuptools.packages.find]
where = ["core/src", "logbill/src", "parity/src", "sweeper/src", "leastpriv/src", "receipt/src", "fleet/collector/src"]

[tool.setuptools.package-data]
logbill = ["prices.json", "doc_style.css"]
dawnfix_sweeper = ["prices.json"]
