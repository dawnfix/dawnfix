[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dawnfix-logbill"
version = "0.1.0"
description = "Read-only CloudWatch Logs bill X-ray: $ per log group and per log line, with savings."
readme = "README.md"
requires-python = ">=3.11"
license = "FSL-1.1-ALv2"
authors = [{ name = "Dawnfix" }]
keywords = ["sre", "aws", "cloudwatch-logs", "finops", "cost"]
dependencies = [
    "boto3>=1.34",
    "dawnfix-core",   # redactor and the read-only client guard; installed from ../core (see Makefile)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
logbill = "logbill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logbill = ["prices.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
