# Part of Dawnfix (https://github.com/dawnfix/dawnfix), source available under the Functional
# Source License 1.1, ALv2 Future License: see LICENSE at the root of that repo.
#
# Release: on a tag vX.Y.Z, run the test suites, build the PyPI package dawnfix (wheel and
# sdist, from pyproject.toml) and the npm package dawnfix (cli/), publish both with trusted
# publishing (OIDC, no tokens stored anywhere), then move the major tag (v0) to this release.
# One-time setup on npmjs.com and pypi.org: RELEASING.md.
#
# Order matters: the reusable workflows at @v0 install dawnfix==<their DAWNFIX_VERSION> from
# PyPI and load prompts/ci/ from the tag v<DAWNFIX_VERSION>. So v0 moves only after both
# packages are published; a failed publish leaves v0 on the previous release.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    name: tests and versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      # The tag, both packages, every tool and every workflow say the same version.
      - name: One version everywhere
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          bad=0
          check() { if [ "$2" != "$want" ]; then echo "::error::$1 says '$2', the tag says $want"; bad=1; fi; }
          check pyproject.toml "$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          check cli/package.json "$(jq -r .version cli/package.json)"
          for f in core logbill parity sweeper leastpriv receipt fleet/collector; do
            check "$f/pyproject.toml" "$(sed -n 's/^version = "\(.*\)"$/\1/p' "$f/pyproject.toml")"
          done
          for f in core/src/dawnfix_core logbill/src/logbill parity/src/dawnfix_parity sweeper/src/dawnfix_sweeper \
                   leastpriv/src/dawnfix_leastpriv receipt/src/dawnfix_receipt fleet/collector/src/dawnfix_fleet; do
            check "$f/__init__.py" "$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$f/__init__.py")"
          done
          for f in .github/workflows/dawnfix.yml .github/workflows/parity.yml .github/workflows/flare.yml \
                   .github/workflows/receipt.yml templates/github/workflows/*.yml templates/gitlab/dawnfix.gitlab-ci.yml; do
            check "$f" "$(sed -n 's/^  DAWNFIX_VERSION: "\(.*\)"$/\1/p' "$f")"
          done
          exit "$bad"

      - name: Python tests (core and each tool)
        run: |
          for d in core logbill parity sweeper leastpriv receipt fleet/collector; do
            echo "::group::$d"
            python -m venv "$RUNNER_TEMP/venv-${d//\//-}"
            py="$RUNNER_TEMP/venv-${d//\//-}/bin/python"
            if [ "$d" = core ]; then "$py" -m pip install --quiet -e 'core[dev]'
            else "$py" -m pip install --quiet -e core -e "${d}[dev]"; fi
            (cd "$d" && "$py" -m pytest -q)
            echo "::endgroup::"
          done
          "$RUNNER_TEMP/venv-core/bin/python" -m pytest -q infra/tests

      - name: Flare tests and bundle
        working-directory: flare
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build:check

      - name: npm package tests and bundle
        working-directory: cli
        run: |
          npm ci
          npm run build:check
          npm test

  build:
    name: build both packages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Build the PyPI package (wheel and sdist)
        run: |
          python -m pip install --quiet build==1.6.1
          python -m build --outdir "$RUNNER_TEMP/pypi" .
          ls -l "$RUNNER_TEMP/pypi"

      # prepack checks the bundle is fresh and copies the root LICENSE into the package.
      - name: Pack the npm package
        working-directory: cli
        run: |
          npm ci
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          tar tzf "$RUNNER_TEMP"/npm/dawnfix-*.tgz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-dist
          path: ${{ runner.temp }}/pypi/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-dist
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
          retention-days: 7

  # Trusted publishing: PyPI trusts this repo, this workflow file and the environment `pypi`
  # (RELEASING.md). The action exchanges the job's OIDC token for a short-lived upload token.
  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/dawnfix/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pypi-dist
          path: dist/

      # skip-existing: a re-run after a later job failed does not fail here.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # Trusted publishing: npm trusts this repo, this workflow file and the environment `npm`
  # (RELEASING.md); npm 11.5.1 or later exchanges the OIDC token itself and, with
  # --provenance, attaches the signed build provenance. The very first publish of the name is
  # manual (RELEASING.md): npm can only trust a workflow for a package that exists.
  npm:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/dawnfix
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: npm-dist
          path: npm-dist/

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          # No registry-url: it would write an .npmrc expecting NODE_AUTH_TOKEN; trusted
          # publishing needs no token, and the default registry is npmjs.org.

      # A version already on npm (the manual first publish, or a re-run) is skipped, not failed.
      - name: npm publish --provenance
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm install --global --quiet npm@11.21.2
          npm --version
          if [ "$(npm view "dawnfix@${TAG#v}" version 2>/dev/null)" = "${TAG#v}" ]; then
            echo "::notice::dawnfix@${TAG#v} is on npm already; nothing to publish"
            exit 0
          fi
          npm publish ./npm-dist/dawnfix-*.tgz --provenance --access public

  # The reusable workflows are called as @v0: point it at this release, now that both
  # packages it installs are published. Same major only (a v1.0.0 tag moves v1).
  move-major-tag:
    name: move the major tag
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Move vMAJOR to this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          case "$major" in v[0-9]*) ;; *) echo "::error::cannot read the major version of $TAG"; exit 1 ;; esac
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
          echo "$major now points at $TAG ($GITHUB_SHA)"
