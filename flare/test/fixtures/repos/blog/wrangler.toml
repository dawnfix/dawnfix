name = "blog"
main = "src/index.ts"
compatibility_date = "2023-01-01" # old on purpose
workers_dev = false
preview_urls = false
routes = [ { pattern = "blog.example.com/*", zone_name = "example.com" } ]

[[unsafe.bindings]]
name = "PAGE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[env.staging]
workers_dev = true

[[env.staging.ratelimits]]
name = "PAGE_LIMIT"
namespace_id = "1001"

  [env.staging.ratelimits.simple]
  limit = 100
  period = 60
